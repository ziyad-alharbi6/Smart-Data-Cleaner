<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Data Cleaner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="top-bar">
        <select id="languageSelect" class="language-select" onchange="changeLanguageFromSelect()">
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>

        <a href="login.html" id="loginLink">Login</a>
    </div>

    <h1 id="mainTitle">Smart Data Cleaner</h1>
    <p id="subtitle">Clean your data easily.</p>

    <nav>
        <a href="index.html" id="homeLink">Home</a>
        <a href="about.html" id="aboutPageLink">About Us</a>
    </nav>
</header>

<section class="login-box">

    <h2 id="loginTitle">Login</h2>

    <form>

        <label for="email" id="emailLabel">Email:</label>
        <br>
        <input type="email" id="email" placeholder="Enter your email" required>
        <p id="emailError" class="warning"></p>

        <br><br>

        <label for="password" id="passwordLabel">Password:</label>
        <br>
        <input type="password" id="password" placeholder="Enter your password" required>
        <p id="passwordError" class="warning"></p>

        <br><br>

        <input type="button" id="loginButton" value="Login" onclick="validateLogin()">

    </form>

    <p>
        <span id="noAccountText">Don't have an account?</span>
        <a href="signup.html" id="signupLink">Sign Up</a>
    </p>

</section>

<footer>
    <p>© 2026 Smart Data Cleaner</p>
</footer>

<script src="language.js"></script>
<script src="validator.js"></script>

</body>
</html>
