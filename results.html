
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>Smart Data Cleaner</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>

<header>
    <div class="top-bar">
        <select id="languageSelect" class="language-select" onchange="changeLanguageFromSelect()">
            <option value="en">English</option>
            <option value="ar">العربية</option>
        </select>

        <a href="login.html" id="loginLink">Login</a>
    </div>

    <h1 id="mainTitle">Smart Data Cleaner</h1>
    <p id="subtitle">Clean your data easily.</p>

    <nav>
        <a href="index.html" id="homeLink">Home</a>
    </nav>
</header>

<main>

    <section class="results-box">

        <h2 id="resultsTitle">Analysis Results</h2>

        <p id="fileName">File name: test.xlsx</p>

        <h3 id="summaryTitle">Dataset Summary</h3>

        <p id="rowsLabel">Total Rows: 0</p>
        <p id="columnsLabel">Total Columns: 0</p>

        <h3 id="issuesTitle">Issues Detected</h3>

        <button type="button"
                id="detailsButton"
                onclick="toggleDetails()">
            Hide Details
        </button>

        <div id="detailsSection">

            <table border="1">

                <tr>
                    <th id="issueType">Issue Type</th>
                    <th id="countTitle">Count</th>
                </tr>

                <tr id="row-missing">
                    <td id="missingLabel">Missing Values</td>
                    <td id="missingCount">0</td>
                </tr>

                <tr id="row-duplicates">
                    <td id="duplicateLabel">Duplicate Rows</td>
                    <td id="duplicateCount">0</td>
                </tr>

                <tr id="row-formatting">
                    <td id="formatLabel">Formatting Issues</td>
                    <td id="formattingCount">0</td>
                </tr>

                <tr id="row-spaces">
                    <td id="spacesLabel">Extra Spaces</td>
                    <td id="spacesCount">0</td>
                </tr>

            </table>

        </div>

        <br>

        <input type="button"
               id="cleanButton"
               value="Clean Data"
               onclick="cleanData()">

        <p id="statusMessage"></p>

    </section>

</main>

<footer>
    <p>© 2026 Smart Data Cleaner</p>
</footer>


<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="language.js"></script>
<script src="data.js"></script>


</body>
</html>
