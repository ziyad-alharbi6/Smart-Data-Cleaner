
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - منظف البيانات الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Data Cleaner</h1>
        <p>نظّف بياناتك بسهولة</p>

        <nav>
            <a href="index-ar.html">الرئيسية</a>
            <a href="login-ar.html">تسجيل الدخول</a>
            <a href="login.html">English</a>
        </nav>
    </header>

    <section class="login-box">

        <h2>تسجيل الدخول</h2>

        <form>

            <label for="email">البريد الإلكتروني:</label>
            <br>
            <input
                type="email"
                id="email"
                placeholder="أدخل بريدك الإلكتروني"
                required
            >

            <br><br>

            <label for="password">كلمة المرور:</label>
            <br>
            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                required
            >

            <br><br>

            <input type="submit" value="تسجيل الدخول">

        </form>

    </section>

    <footer>
        <p>© 2026 Smart Data Cleaner</p>
    </footer>

</body>
</html>
